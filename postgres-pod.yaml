apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: parcial2-app
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      ports:
        - containerPort: 5432
      envFrom:
        - secretRef:
            name: postgres-secret
      volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: pg-data
      emptyDir: {}
